<body>
<header><h1>工作工具</h1><div class="muted" id="today"></div></header>
<main>
  <div class="alerts" id="alerts"></div>
  <div class="grid" id="grid"></div>

  <div class="card">
    <h2>所有工具的备份</h2>
    <div class="muted">一段文字包含所有工具的数据。把它保存在微信（发给自己）或手机备忘录里。Coloring 问题的照片不包含在内.</div>
    <div class="row"><button class="pri" id="bShare">发送备份</button><button id="bCopy">复制</button></div>
    <details style="margin-top:12px"><summary>恢复备份</summary>
      <div class="muted" style="margin-top:6px">把完整备份粘贴到这里。（旧版单个工具的备份：请在该工具内部恢复.)</div>
      <textarea id="rTxt" placeholder="{ ... }"></textarea>
      <div class="row"><button id="bRestore">恢复</button></div>
    </details>
  </div>
</main>
<div id="toast"></div>
<script>
var TOOLS = [
  {k:"check", n:"班前检查",   d:"OK / NOK 每条线两分钟",       key:"shift_check_v1"},
  {k:"rep",   n:"班次报告",       d:"班次结束报告",            key:"shift_report_v1"},
  {k:"maint", n:"维修申请",       d:"故障照片和线号，发给维修",      key:"maint_cfg_v1"},
  {k:"stops", n:"停线记录",         d:"故障、措施、结果",        key:"line_stops_v1"},
  {k:"col",   n:"Coloring 问题",       d:"问题附 6 张照片",              key:"col_issues_cfg_v1"},
  {k:"atl",   n:"故障记录",         d:"故障与柏拉图",               key:"atl_log_v1"},
  {k:"parts", n:"零件更换",         d:"零件及其来源",            key:"parts_replace_v1"},
  {k:"notes", n:"备注",             d:"可复制的英文备注",       key:"notes_en_v1"},
  {k:"mold",  n:"模具和石英管",   d:"每条线的数量和尺寸",        key:"molds_quartz_v1"},
];
function $(i){ return document.getElementById(i); }
function get(key){ try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function toast(m){ var t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("on"); }, 1800); }
function go(k){ openTool(k); }

function counts(){
  var c = {}, al = [];
  var st = get("line_stops_v1");
  if (st && st.stops){ var live = st.stops.filter(function(s){ return !s.end; }); if (live.length){ c.stops = {n:live.length}; al.push({k:"stops", t:live.length === 1 ? "一条线正在停机" : live.length + " 正在停机的线", ic:"⏸"}); } }
  var pr = get("parts_replace_v1");
  if (pr && pr.log){ var ow = pr.log.filter(function(e){ return e.src === "line" && !e.back; }); if (ow.length){ c.parts = {n:ow.length, w:1}; al.push({k:"parts", t:ow.length === 1 ? "从一条线拿走且未补回的零件" : ow.length + " 从其他线拿走且未补回的零件", ic:"⇆", w:1}); } }
  var ck = get("shift_check_v1");
  if (ck && ck.checks){ var d = new Date(), h = d.getHours(), sh = h < 8 ? "N" : h < 16 ? "M" : "E", day = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    var cs = ck.checks.filter(function(x){ return x.day === day && x.sh === sh; }), nk = cs.filter(function(x){ return x.nok.length; });
    if (nk.length){ c.check = {n:nk.length}; al.push({k:"check", t:"检查: " + nk.length + (nk.length === 1 ? " 线 NOK" : " 线 NOK") + " 本班", ic:"✗"}); } }
  var mo = get("maint_open_v1");
  if (mo && mo.n){ c.maint = {n:mo.n, w:mo.urg ? 0 : 1}; al.push({k:"maint", t:(mo.n === 1 ? "未处理的维修申请" : mo.n + " 未处理的维修申请") + (mo.urg ? " (" + mo.urg + " 紧急)" : ""), ic:"🔧", w:mo.urg ? 0 : 1}); }
  return {c:c, al:al};
}
function draw(){
  var r = counts();
  $("alerts").innerHTML = r.al.map(function(a){ return '<a class="alert' + (a.w ? ' w' : '') + '" href="' + a.k + '/index.html"><b>' + a.ic + '</b><span>' + a.t + '</span></a>'; }).join("");
  $("grid").innerHTML = TOOLS.map(function(t){
    var b = r.c[t.k];
    return '<a class="tile" href="' + t.k + '/index.html">' + (b ? '<i class="badge' + (b.w ? ' w' : '') + '">' + b.n + '</i>' : '') +
      '<img src="' + ICON[t.k] + '" alt=""><span>' + t.n + '</span><small>' + t.d + '</small></a>';
  }).join("");
  var d = new Date(), days = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  $("today").textContent = days[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear();
}

function backup(){
  var o = {app:"adawat_al_amal", v:1, at:new Date().toISOString(), data:{}};
  TOOLS.forEach(function(t){ try { var r = localStorage.getItem(t.key); if (r) o.data[t.key] = r; } catch(e){} });
  return JSON.stringify(o);
}
function copyText(s){
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(function(){ toast("已复制"); }, function(){ fallbackCopy(s); }); }
  else fallbackCopy(s);
}
function fallbackCopy(s){ var t = document.createElement("textarea"); t.value = s; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); toast("已复制"); } catch(e){ toast("复制失败"); } t.remove(); }
$("bShare").onclick = function(){ var s = backup(); if (window.Android && Android.share) Android.share(s); else copyText(s); };
$("bCopy").onclick = function(){ copyText(backup()); };
$("bRestore").onclick = function(){
  var s = $("rTxt").value.trim(); if (!s){ toast("请先粘贴备份"); return; }
  try {
    var o = JSON.parse(s); if (o.app !== "adawat_al_amal" || !o.data) throw 0;
    var n = 0;
    TOOLS.forEach(function(t){ if (typeof o.data[t.key] === "string"){ JSON.parse(o.data[t.key]); localStorage.setItem(t.key, o.data[t.key]); n++; } });
    $("rTxt").value = ""; toast("已恢复 " + n + " 工具"); draw();
  } catch(e){ toast("文字无效"); }
};
draw();
window.addEventListener("pageshow", draw);
</script>

<style>
#toolFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);z-index:50;display:none}
#toolFrame.on{display:block}
</style>
<iframe id="toolFrame" title="tool"></iframe>
<script>
function openTool(k){
  if (!TOOL_HTML[k]) return;
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(new Blob([TOOL_HTML[k]], {type:"text/html"}));
  var f = document.getElementById("toolFrame"); f.src = curUrl; f.classList.add("on");
  document.documentElement.style.overflow = "hidden";
  try { history.pushState({tool:k}, ""); } catch(e){}
}
function closeTool(fromPop){
  var f = document.getElementById("toolFrame"); if (!f.classList.contains("on")) return;
  f.classList.remove("on"); f.src = "about:blank"; document.documentElement.style.overflow = "";
  if (typeof draw === "function") draw();
  if (!fromPop){ try { if (history.state && history.state.tool) history.back(); } catch(e){} }
}
window.addEventListener("popstate", function(){ closeTool(true); });
// tiles and alerts link to "<tool>/index.html": open them here instead
document.addEventListener("click", function(e){
  var a = e.target.closest ? e.target.closest("a[href$='/index.html']") : null; if (!a) return;
  e.preventDefault(); openTool(a.getAttribute("href").split("/")[0]);
});
</script>
</body>
</html>
