\"chips\" id=\"sProc\" style=\"margin:10px 0 6px\"><\/div>\n    <textarea id=\"itemsTxt\" style=\"min-height:260px;font-size:13.5px\"><\/textarea>\n    <label class=\"lb\">工序和线数（每行一个工序：名称:数量)<\/label><textarea id=\"procTxt\" class=\"en\"><\/textarea>\n    <button class=\"primary wide\" id=\"saveSet\">保存<\/button>\n  <\/div>\n<\/section>\n<\/main>\n\n<nav>\n  <a href=\"#check\" data-v=\"check\"><b>✓<\/b>检查<\/a>\n  <a href=\"#rep\" data-v=\"rep\"><b>▤<\/b>报告<\/a>\n  <a href=\"#set\" data-v=\"set\"><b>⚙<\/b>设置<\/a>\n<\/nav>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\nvar DEF_ITEMS = [\n  \"轮： dancer 转动顺畅，没有间隙 | Dancer pulleys (free rotation, no play)\",\n  \"  dancer 在正确位置 | Dancer position\",\n  \"传感器： dancer 已固定 | Dancer sensor fixing\",\n  \"导轮转动正常 | Guide pulleys rotation\",\n  \"没有异常振动或声音 | Vibration / noise\",\n  \"屏幕无报警 | HMI alarms\",\n  \"  die 干净 | Die cleanliness\",\n  \"灯 UV 正常 | UV lamp\",\n  \"张力： take-up | Take-up tension | #\",\n  \"张力： pay-off | Pay-off tension | #\",\n  \"氮气纯度 | Nitrogen purity | # %\",\n  \"氮气流量 | Nitrogen flow | #\",\n  \"气压 | Air pressure | # MPa\"\n].join(\"\\n\");\nvar KEY = \"shift_check_v1\", mem = null;\nfunction load(){ try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return mem; }\nvar DB = load() || {procTxt:\"Coloring:10\\nMMT:10\", items:{}, checks:[]};\nDB.items = DB.items || {}; DB.checks = DB.checks || [];\n// v2: removed paint marks and length items from saved lists too\nif (!DB.v2){ Object.keys(DB.items).forEach(function(k){ DB.items[k] = DB.items[k].split(\"\\n\").filter(function(l){ return !/Screw paint marks|segment length on HMI/.test(l); }).join(\"\\n\"); }); DB.v2 = 1; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} }\nvar COL_EXTRA = [\"油墨颜色与计划一致 | Ink color | @\",\"所用油墨的搅拌时间（至少 6 小时) | Ink mixing time | # h | >=6\",\"油墨罐液位充足 | Ink level\",\"酒精测试 (curing) OK | Curing test (alcohol rub)\",\"石英管干净，没有油墨 | Quartz tube cleanliness\",\"气管： anti-drip 安装正确 | Anti-drip air hoses\",\"光纤类型和 ID 盘号一致 | Fibre type / reel ID\",\"光纤走线正确（经过所有导轮) | Fibre path\",\"限位： traverse 已调好 | Traverse limits\",\"打印 / 色环清晰 | Printing / ring marking\"].join(\"\\n\");\nfunction defFor(p){ return /color/i.test(p) ? DEF_ITEMS + \"\\n\" + COL_EXTRA : DEF_ITEMS; }\nvar NEW_V3 = [\"张力： take-up | Take-up tension | #\", \"张力： pay-off | Pay-off tension | #\", \"氮气纯度 | Nitrogen purity | # %\", \"氮气流量 | Nitrogen flow | #\", \"气压 | Air pressure | # MPa\"];\nif (!DB.v3){ Object.keys(DB.items).forEach(function(k){ var t = DB.items[k]; NEW_V3.forEach(function(l){ var en = l.split(\"|\")[1].trim(); if (t.indexOf(en) < 0) t += \"\\n\" + l; }); DB.items[k] = t; }); DB.v3 = 1; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} }\nif (!DB.v4){ Object.keys(DB.items).forEach(function(k){ if (!/color/i.test(k)) return; var t = DB.items[k]; COL_EXTRA.split(\"\\n\").forEach(function(l){ var en = l.split(\"|\")[1].trim(); if (t.indexOf(en) < 0) t += \"\\n\" + l; }); DB.items[k] = t; }); DB.v4 = 1; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} }\nif (!DB.v5){ Object.keys(DB.items).forEach(function(k){ DB.items[k] = DB.items[k].replace(/(Air pressure\\s*\\|\\s*#\\s*)bar(\\s*\\|\\s*([\\d.]+)\\s*-\\s*([\\d.]+))?/i, function(m0, a, lim, lo, hi){ return a + \"MPa\" + (lim ? \" | \" + (+lo / 10) + \"-\" + (+hi / 10) : \"\"); }); }); DB.v5 = 1; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} }\nfunction save(){ mem = DB; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ toast(\"保存失败\"); } }\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nvar tt; function toast(m){ var t = $(\"toast\"); t.textContent = m; t.classList.add(\"on\"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove(\"on\"); }, 1800); }\nfunction share(text){ try { if (window.Android && Android.share){ Android.share(text); return; } } catch(e){} copy(text); }\nfunction copy(text){ var ta = document.createElement(\"textarea\"); ta.value = text; ta.style.position = \"fixed\"; ta.style.opacity = \"0\"; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand(\"copy\"); } catch(e){} ta.remove(); toast(ok ? \"已复制\" : \"复制失败\"); }\nfunction chips(el, items, sel, onPick){\n  el.innerHTML = \"\";\n  items.forEach(function(it){ var v = Array.isArray(it) ? it[0] : it, l = Array.isArray(it) ? it[1] : it, c = document.createElement(\"span\");\n    c.className = \"chip\" + (v === sel ? \" on\" : \"\"); c.textContent = l; c.onclick = function(){ onPick(v); }; el.appendChild(c); });\n}\nfunction procs(){ return DB.procTxt.split(\"\\n\").map(function(l){ var m = l.split(\":\"); return {name:(m[0] || \"\").trim(), n:parseInt(m[1], 10) || 0}; }).filter(function(p){ return p.name && p.n > 0; }); }\nfunction nLines(p){ var x = procs().filter(function(q){ return q.name === p; })[0]; return x ? x.n : 10; }\nfunction itemsOf(p){ return (DB.items[p] || defFor(p)).split(\"\\n\").map(function(l){ var m = l.split(\"|\"), it = {ar:(m[0] || \"\").trim(), en:(m[1] || m[0] || \"\").trim()};\n  var v = (m[2] || \"\").trim(); if (v.charAt(0) === \"@\"){ it.val = true; it.txt = true; it.unit = \"\"; }\n  if (v.charAt(0) === \"#\"){ it.val = true; it.unit = v.slice(1).trim(); var lim = (m[3] || \"\").trim(), r = lim.match(/^(-?[\\d.]+)\\s*-\\s*(-?[\\d.]+)$/), g = lim.match(/^(?:>=|≥|>)\\s*(-?[\\d.]+)$/), l2 = lim.match(/^(?:<=|≤|<)\\s*(-?[\\d.]+)$/);\n    if (r){ it.min = +r[1]; it.max = +r[2]; } else if (g){ it.min = +g[1]; it.max = Infinity; } else if (l2){ it.min = -Infinity; it.max = +l2[1]; } }\n  return it; }).filter(function(x){ return x.ar; }); }\nfunction limTxt(it){ return it.min == null ? \"\" : it.max === Infinity ? \"≥\" + it.min : it.min === -Infinity ? \"≤\" + it.max : it.min + \"-\" + it.max; }\nfunction fmtV(it, v){ return v === \"\" || v == null ? \"\" : v + (it.unit ? \" \" + it.unit : \"\"); }\nfunction pad(n){ return (\"0\" + n).slice(-2); }\nfunction dayKey(d){ return d.getFullYear() + \"-\" + pad(d.getMonth() + 1) + \"-\" + pad(d.getDate()); }\nfunction shiftOf(d){ var h = d.getHours(); return h < 8 ? \"N\" : h < 16 ? \"M\" : \"E\"; }\nvar SHN = {M:\"早班\", E:\"中班\", N:\"夜班\"}, SHE = {M:\"Morning\", E:\"Afternoon\", N:\"Night\"};\n// current shift slot; night shift 00-08 belongs to its calendar day\nfunction slot(d){ return {day:dayKey(d), sh:shiftOf(d)}; }\nfunction find(day, sh, proc, line){ return DB.checks.filter(function(c){ return c.day === day && c.sh === sh && c.proc === proc && c.line === line; })[0]; }\n\n/* ---------- check ---------- */\nvar C = {proc:null, line:null, res:{}, val:{}, note:\"\"};\nfunction drawCheck(){\n  var ps = procs().map(function(p){ return p.name; }); if (ps.indexOf(C.proc) < 0) C.proc = DB.lastProc && ps.indexOf(DB.lastProc) >= 0 ? DB.lastProc : ps[0];\n  chips($(\"cProc\"), ps, C.proc, function(v){ C.proc = v; C.line = null; drawCheck(); });\n  var s = slot(new Date()), h = \"\";\n  for (var i = 1; i <= nLines(C.proc); i++){\n    var c = find(s.day, s.sh, C.proc, i), cls = c ? (c.nok.length ? \"nok\" : \"ok\") : \"\";\n    h += '<div class=\"ln ' + cls + (C.line === i ? \" sel\" : \"\") + '\" data-l=\"' + i + '\">L' + i + '<small>' + (c ? (c.nok.length ? c.nok.length + \" NOK\" : \"OK\") : \"—\") + '<\/small><\/div>';\n  }\n  $(\"cLines\").innerHTML = h;\n  $(\"cLines\").querySelectorAll(\".ln\").forEach(function(el){ el.onclick = function(){ pick(+el.getAttribute(\"data-l\")); }; });\n  drawForm();\n}\nfunction pick(l){\n  C.line = l; var s = slot(new Date()), c = find(s.day, s.sh, C.proc, l), its = itemsOf(C.proc);\n  C.res = {}; C.val = c && c.vals ? JSON.parse(JSON.stringify(c.vals)) : {}; C.note = c ? c.note || \"\" : \"\";\n  if (c){ its.forEach(function(it){ C.res[it.en] = c.nok.indexOf(it.en) >= 0 ? \"n\" : (c.ok.indexOf(it.en) >= 0 ? \"y\" : undefined); }); }\n  drawCheck(); setTimeout(function(){ var f = $(\"cForm\"); if (f.scrollIntoView) f.scrollIntoView({behavior:\"smooth\", block:\"start\"}); }, 30);\n}\nfunction drawForm(){\n  var f = $(\"cForm\");\n  if (!C.line){ f.innerHTML = '<div class=\"empty\">点击一条线开始检查<\/div>'; return; }\n  var its = itemsOf(C.proc), done = its.filter(function(it){ return C.res[it.en]; }).length;\n  var h = '<h2><span style=\"direction:ltr\">' + esc(C.proc) + ' L' + C.line + '<\/span><button class=\"sm okb\" id=\"allOk\">全部 OK ✓<\/button><\/h2>' +\n    '<div class=\"prog\"><i style=\"width:' + (done / its.length * 100) + '%\"><\/i><\/div><div class=\"muted\">' + done + ' / ' + its.length + '<\/div>';\n  its.forEach(function(it, i){ var r = C.res[it.en];\n    var vin = it.val ? '<div class=\"vv\"><input class=\"en vin\" type=\"text\" ' + (it.txt ? 'style=\"font-weight:600\"' : 'inputmode=\"decimal\"') + ' data-i=\"' + i + '\" value=\"' + esc(C.val[it.en] || \"\") + '\" placeholder=\"' + (it.txt ? \"e.g. Blue\" : it.min != null ? limTxt(it) : \"数值\") + '\">' + (it.unit ? '<em>' + esc(it.unit) + '<\/em>' : '') + '<\/div>' : '';\n    h += '<div class=\"ci' + (r === \"n\" ? \" bad\" : \"\") + '\"><div class=\"tx\"><b>' + esc(it.ar) + '<\/b><span>' + esc(it.en) + '<\/span>' + vin + '<\/div>' +\n      '<div class=\"bt\"><button class=\"y' + (r === \"y\" ? \" on\" : \"\") + '\" data-i=\"' + i + '\" data-r=\"y\">✓<\/button><button class=\"n' + (r === \"n\" ? \" on\" : \"\") + '\" data-i=\"' + i + '\" data-r=\"n\">✗<\/button><\/div><\/div>';\n  });\n  h += '<label class=\"lb\">英文备注（可选)<\/label><input id=\"cNote\" class=\"en\" placeholder=\"e.g. L3 dancer pulley has play, maintenance informed\" value=\"' + esc(C.note) + '\">' +\n    '<button class=\"primary wide\" id=\"cSave\">保存检查<\/button>';\n  f.innerHTML = h;\n  f.querySelectorAll(\".bt button\").forEach(function(b){ b.onclick = function(){ var it = its[+b.getAttribute(\"data-i\")], r = b.getAttribu =\"margin-top:6px;direction:ltr;text-align:left\">\n    <label class=\"lb\">措施（点击添加，用以下分隔： /)<\/label><div class=\"chips\" id=\"iActs\"><\/div>\n    <textarea class=\"en\" id=\"iActTxt\" style=\"margin-top:6px\" placeholder=\"Actions\"><\/textarea>\n    <label class=\"lb\">状态<\/label><div class=\"chips\" id=\"iStat\"><\/div>\n    <button class=\"primary wide\" id=\"saveIssue\">保存问题<\/button>\n    <button class=\"wide\" id=\"cancelIssue\">返回<\/button>\n  <\/div>\n<\/section>\n\n<section class=\"view\" id=\"v-send\">\n  <div class=\"card\">\n    <h2>消息<\/h2>\n    <pre id=\"msg\"><\/pre>\n    <div class=\"row\" style=\"margin-top:10px\">\n      <button class=\"primary\" id=\"send\">发送到 WhatsApp<\/button>\n      <button id=\"copy\">复制<\/button>\n    <\/div>\n    <label class=\"chk muted\" style=\"display:flex;gap:8px;align-items:center;margin-top:12px\"><input type=\"checkbox\" id=\"okOnly\" style=\"width:20px;height:20px\"> 在消息中显示停机的线<\/label>\n  <\/div>\n  <div class=\"card\">\n    <h2>发送后<\/h2>\n    <p class=\"muted\">\"新班次\" 把这份报告保存到记录里，清空问题和备注，线的状态保持不变.<\/p>\n    <button class=\"wide\" id=\"newShift\">新班次<\/button>\n  <\/div>\n<\/section>\n\n<section class=\"view\" id=\"v-set\">\n  <div class=\"card\">\n    <h2>工序和线数<\/h2>\n    <p class=\"muted\">每行一个工序，格式：名称:线数<\/p>\n    <textarea class=\"en\" id=\"procTxt\" style=\"min-height:140px\"><\/textarea>\n    <label class=\"lb\">常用问题（用逗号分隔)<\/label><textarea class=\"en\" id=\"probTxt\"><\/textarea>\n    <label class=\"lb\">常用措施（用逗号分隔)<\/label><textarea class=\"en\" id=\"actTxt\"><\/textarea>\n    <button class=\"primary wide\" id=\"saveSet\">保存<\/button>\n  <\/div>\n  <div class=\"card\">\n    <h2>以前的报告<\/h2>\n    <div id=\"history\"><\/div>\n  <\/div>\n<\/section>\n<\/main>\n\n<nav>\n  <a href=\"#shift\" data-v=\"shift\"><b>▦<\/b>班次<\/a>\n  <a href=\"#issue\" data-v=\"issue\"><b>＋<\/b>问题<\/a>\n  <a href=\"#send\" data-v=\"send\"><b>➤<\/b>发送<\/a>\n  <a href=\"#set\" data-v=\"set\"><b>⚙<\/b>设置<\/a>\n<\/nav>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script id=\"core\">\nvar SHIFTS = [[\"N\",\"Night\",\"00-08\"],[\"M\",\"Morning\",\"08-16\"],[\"E\",\"Evening\",\"16-24\"]];\nvar STAT = [[\"solved\",\"Solved\",\"已解决\"],[\"progress\",\"In progress\",\"维修中\"],[\"maint\",\"Waiting maintenance\",\"等待维修\"],[\"parts\",\"Waiting parts\",\"等待零件\"]];\nfunction shiftOf(d){ var h = d.getHours(); return h < 8 ? \"N\" : h < 16 ? \"M\" : \"E\"; }\nfunction lineList(arr){ return arr.slice().sort(function(a, b){ return a - b; }).join(\"/\"); }\nfunction buildMessage(R, showOff){\n  var sh = SHIFTS.filter(function(s){ return s[0] === R.shift; })[0] || SHIFTS[1];\n  var d = R.date ? R.date.split(\"-\").reverse().slice(0, 2).join(\"/\") : \"\";\n  var out = [\"Shift report \" + d + \" - \" + sh[1] + \" (\" + sh[2] + \")\"];\n  var lines = [];\n  R.procs.forEach(function(p){\n    var st = R.lines[p.name] || {}, ok = [], nok = [], off = [];\n    for (var i = 1; i <= p.n; i++){ var s = st[i]; if (s === \"ok\") ok.push(i); else if (s === \"nok\") nok.push(i); else off.push(i); }\n    if (!ok.length && !nok.length && !showOff) return;\n    var parts = [];\n    if (ok.length) parts.push(\"L \" + lineList(ok) + \" OK\");\n    if (nok.length) parts.push(\"L \" + lineList(nok) + \" NOK\");\n    if (showOff && off.length) parts.push(\"L \" + lineList(off) + \" off\");\n    lines.push(p.name + \": \" + (parts.length ? parts.join(\" | \") : \"all off\"));\n  });\n  if (lines.length){ out.push(\"\"); out.push(\"Lines\"); out = out.concat(lines); }\n  if (R.issues.length){\n    out.push(\"\"); out.push(\"Issues\");\n    R.issues.forEach(function(it, i){\n      var st = STAT.filter(function(s){ return s[0] === it.status; })[0];\n      if (i) out.push(\"\");\n      out.push(it.proc + \" L \" + it.line + \": \" + it.problem);\n      if (it.actions) out.push(\"Action: \" + it.actions);\n      if (st) out.push(\"Status: \" + st[1]);\n    });\n  }\n  if (R.notes && R.notes.trim()){ out.push(\"\"); out.push(\"Notes\"); out.push(R.notes.trim()); }\n  return out.join(\"\\n\");\n}\n<\/script>\n\n<script>\nvar KEY = \"shift_report_v1\", mem = null;\nvar DEF_PROCS = \"Coloring:10\\nMMT:10\\nSC:4\\nCP:4\\nJKT:12\\nMC:8\\nMMC:12\";\nvar DEF_PROBS = \"Fibre break, Color delete, Coiling NOK, Tension NOK, Vibration, Ring / Printing NOK, Tube break, Lumps, OD variation, FRP break, Dancer NOK, Nitrogen NOK, Printer NOK, Cooling water NOK\";\nvar DEF_ACTS = \"Maintenance called, Maintenance on site, Bearing replaced, Pulley cleaned, Die cleaned, Tension adjusted, Coiling parameters adjusted, Speed reduced to 2000, Line stopped, Rewinding (RWD), Hold tag filled, Quality informed, TL informed, Production moved to another line, Waiting for parts from China\";\nfunction load(){ try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return mem || {}; }\nvar DB = load();\nDB.procTxt = DB.procTxt || DEF_PROCS; DB.probs = DB.probs || DEF_PROBS; DB.acts = DB.acts || DEF_ACTS;\nDB.lines = DB.lines || {}; DB.history = DB.history || [];\nfunction save(){ mem = DB; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ toast(\"保存失败\"); } }\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nvar tt; function toast(m){ var t = $(\"toast\"); t.textContent = m; t.classList.add(\"on\"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove(\"on\"); }, 1800); }\nfunction procs(){ return DB.procTxt.split(\"\\n\").map(function(l){ var m = l.split(\":\"); return {name:(m[0] || \"\").trim(), n:parseInt(m[1], 10) || 0}; }).filter(function(p){ return p.name && p.n > 0; }); }\nfunction split(s){ return s.split(/[,，]/).map(function(x){ return x.trim(); }).filter(Boolean); }\nfunction localDate(d){ var z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }\nfunction chips(el, items, sel, onPick, cls){\n  el.innerHTML = \"\";\n  items.forEach(function(it){\n    var v = Array.isArray(it) ? it[0] : it, l = Array.isArray(it) ? it[1] : it;\n    var c = document.createElement(\"span\"); c.className = \"chip\" + (cls ? \" \" + cls : \"\") + (String(v) === String(sel) ? \" on\" : \"\");\n    c.textContent = l; c.onclick = function(){ onPick(v); }; el.appendChild(c);\n  });\n}\nif (!DB.cur){ var n0 = new Date(); DB.cur = {shift:shiftOf(n0), date:localDate(n0), issues:[], notes:\"\"}; }\nfunction R(){ return {shift:DB.cur.shift, date:DB.cur.date, issues:DB.cur.issues, notes:DB.cur.notes, lines:DB.lines, procs:procs()}; }\n\n/* shift view */\nfunction drawShift(){\n  chips($(\"shiftChips\"), SHIFTS.map(function(s){ return [s[0], s[1] + \" \" + s[2]]; }), DB.cur.shift, function(v){ DB.cur.shift = v; save(); drawShift(); });\n  $(\"date\").value = DB.cur.date;\n  var h = \"\";\n  procs().forEach(function(p){\n    var st = DB.lines[p.name] || {}, cnt = 0;\n    for (var k in st) if (st[k] === \"ok\" || st[k] === \"nok\") cnt++;\n    h += '<div class=\"proc\"><span>' + esc(p.name) + '<\/span><span class=\"muted\">' + cnt + '/' + p.n + '<\/span><\/div><div class=\"lines\">';\n    for (var i = 1; i <= p.n; i++) h += '<div class=\"ln ' + (st[i] || \"\") + '\" data-p=\"' + esc(p.name) + '\" data-l=\"' + i + '\">' + i + '<\/div>';\n    h += '<\/div>';\n  });\n  $(\"procs\").innerHTML = h;\n  $(\"procs\").querySelectorAll(\".ln\").forEach(function(el){\n    el.onclick = function(){\n      var p = el.getAttribute(\"data-p\"), l = el.getAttribute(\"data-l\"), st = DB.lines[p] = DB.lines[p] || {};\n      st[l] = st[l] === \"ok\" ? \"nok\" : st[l] === \"nok\" ? \"\" : \"ok\"; if (!st[l]) delete st[l];\n      save(); drawShift();\n    };\n  });\n  var is = DB.cur.issues;\n  $(\"issueCount\").textContent = is.length ? is.length : \"\";\n  $(\"issues\").innerHTML = is.length ? is.map(function(it, i){\n    var s = STAT.filter(function(x){ return x[0] === it.status; })[0];\n    return '<div class=\"issue\"><div class=\"t\"><b>' + esc(it.proc) + ' L ' + it.line + '<\/b><span class=\"muted\">' + (s ? s[2] : \"\") + '<\/span><\/div>' +\n      '<div class=\"en\">' + esc(it.problem) + (it.actions ? '<br><span class=\"muted\">' + esc(it.actions) + '<\/span>' : '') + '<\/div>' +\n      '<div class=\"row\" style=\"margin-top:6px\"><button data-ed=\"' + i + '\">修改<\/button><button data-del=\"' + i + '\">删除<\/button><\/div><\/div>';\n  }).join(\"\") : '<div class=\"empty\">本班没有记录问题<\/div>';\n  $(\"notes\").value = DB.cur.notes || \"\";\n  updHdr();\n}\n$(\"date\").onchange = function(){ DB.cur.date = this.value; save(); };\n$(\"notes\").oninput = function(){ DB.cur.notes = this.value; save(); };\n$(\"allOff\").onclick = function(){ DB.lines = {}; save(); drawShift(); };\nvar delArm = null;\n$(\"issues\").onclick = function(ev){\n  var t = ev.target, i;\n  if ((i = t.getAttribute(\"data-ed\")) != null){ openIssue(+i); }\n  else if ((i = t.getAttribute(\"data-del\")) != null){\n    if (delArm === i){ DB.cur.issues.splice(+i, 1); delArm = null; save(); drawShift(); toast(\"已删除\"); }\n    else { delArm = i; t.textContent = \"点击确认\"; setTimeout(function(){ if (delArm === i){ delArm = null; drawShift(); } }, 3000); }\n  }\n};\n\n/* issue view */\nvar I = null, editIdx = null;\nfunction openIssue(idx){\n  editIdx = idx == null ? null : idx;\n  var src = editIdx == null ? null : DB.cur.issues[editIdx], p0 = procs()[0] || {name:\"Coloring\"};\n  I = src ? JSON.parse(JSON.stringify(src)) : {proc:DB.lastProc || p0.name, line:1, problem:\"\", actions:\"\", status:\"progress\"};\n  $(\"issueTitle\").textContent = src ? \"修改问题\" : \"新问题\";\n  $(\"iProbTxt\").value = I.problem; $(\"iActTxt\").value = I.actions;\n  if (location.hash !== \"#issue\") location.hash = \"#issue\"; else drawIssue();\n}\nfunction drawIssue(){\n  if (!I) openIssue(null);\n  var ps = procs(), cur = ps.filter(function(p){ return p.name === I.proc; })[0] || ps[0];\n  chips($(\"iProc\"), ps.map(function(p){ return p.name; }), I.proc, function(v){ I.proc = v; I.line = 1; drawIssue(); });\n  var ls = []; for (var i = 1; i <= (cur ? cur.n : 1); i++) ls.push(i);\n  chips($(\"iLine\"), ls, I.line, function(v){ I.line = v; drawIssue(); });\n  chips($(\"iProb\"), split(DB.probs), $(\"iProbTxt\").value, function(v){ $(\"iProbTxt\").value = v; drawIssue(); }, \"ph\");\n  chips($(\"iActs\"), split(DB.acts), null, function(v){\n    var t = $(\"iActTxt\").value.trim(); $(\"iActTxt\").value = t ? t + \" / \" + v : v;\n  }, \"ph\");\n  chips($(\"iStat\"), STAT.map(function(s){ return [s[0], s[2]]; }), I.status, function(v){ I.status = v; drawIssue(); });\n}\n$(\"saveIssue\").onclick = function(){\n  I.problem = $(\"iProbTxt\").value.trim(); I.actions = $(\"iActTxt\").value.trim();\n  if (!I.problem){ toast(\"输入或选择问题\"); return; }\n  if (editIdx == null) DB.cur.issues.push(I); else DB.cur.issues[editIdx] = I;\n  var st = DB.lines[I.proc] = DB.lines[I.proc] || {};\n  if (I.status !== \"solved\" && !st[I.line]) st[I.line] = \"nok\";\n  DB.lastProc = I.proc; I = null; save(); toast(\"已保存\"); location.hash = \"#shift\";\n};\n$(\"cancelIssue\").onclick = function(){ I = null; location.hash = \"#shift\"; };\n\n/* send view */\nfunction drawSend(){ $(\"msg\").textContent = buildMessage(R(), $(\"okOnly\").checked); }\n$(\"okOnly\").onchange = drawSend;\nfunction share(text){ try { if (window.Android && Android.share){ Android.share(text); return; } } catch(e){} copy(text); }\nfunction copy(text){\n  var ta = document.createElement(\"textarea\"); ta.value = text; document.body.appendChild(ta); ta.select();\n  var ok = false; try { ok = document.execCommand(\"copy\"); } catch(e){} document.body.removeChild(ta); toast(ok ? \"已复制\" : \"请手动复制文字\");\n}\n$(\"send\").onclick = function(){ share($(\"msg\").textContent); };\n$(\"copy\").onclick = function(){ copy($(\"msg\").textContent); };\n$(\"newShift\").onclick = function(){\n  var b = $(\"newShift\");\n  if ss=\"en\" placeholder=\"Write here\"><button class=\"primary\" id=\"edTxtOk\">✓<\/button><\/div>\n  <div class=\"edbar\"><div class=\"tools\" id=\"edTools\"><\/div><div class=\"cols\" id=\"edCols\"><\/div><\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n<div class=\"busy\" id=\"busy\">正在生成图片……<\/div>\n\n<script>\n/* team A/B/C shared by all tools: remembered for the current day */\nfunction teamToday(){ try { var o = JSON.parse(localStorage.getItem(\"team_today_v1\") || \"{}\"), d = new Date(), k = d.getFullYear() + \"-\" + (d.getMonth() + 1) + \"-\" + d.getDate(); return o.day === k ? o.team : \"\"; } catch(e){ return \"\"; } }\n\nvar KEY = \"maint_cfg_v1\", MAXPH = 6, mem = null;\nvar DEF = {name:\"\", procTxt:\"Coloring:10\\nMMT:10\\nSecondary:10\\nStranding:10\\nJacketing:12\",\n  types:\"Fibre break, Dancer, Pulley / bearing, Capstan, Traverse, Sensor, Motor / inverter, UV lamp, Die / mold, Ink system, Air / nitrogen, Leak, HMI / PLC alarm, Electrical, Other\", lastProc:\"Coloring\"};\nfunction load(){ try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return mem; }\nvar CFG = load() || JSON.parse(JSON.stringify(DEF));\nObject.keys(DEF).forEach(function(k){ if (CFG[k] == null) CFG[k] = DEF[k]; });\nfunction saveCfg(){ mem = CFG; try { localStorage.setItem(KEY, JSON.stringify(CFG)); } catch(e){} }\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nvar tt; function toast(m){ var t = $(\"toast\"); t.textContent = m; t.classList.add(\"on\"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove(\"on\"); }, 2000); }\nfunction busy(on){ $(\"busy\").classList.toggle(\"on\", !!on); }\nfunction uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\nfunction list(s){ return String(s || \"\").split(\",\").map(function(x){ return x.trim(); }).filter(Boolean); }\nfunction procs(){ return CFG.procTxt.split(\"\\n\").map(function(l){ var m = l.split(\":\"); return {name:(m[0] || \"\").trim(), n:parseInt(m[1], 10) || 0}; }).filter(function(p){ return p.name && p.n > 0; }); }\nfunction chips(el, items, sel, onPick, cls){\n  el.innerHTML = \"\";\n  items.forEach(function(it){ var v = Array.isArray(it) ? it[0] : it, l = Array.isArray(it) ? it[1] : it, c = document.createElement(\"span\");\n    c.className = \"chip\" + (cls ? \" \" + cls : \"\") + (String(v) === String(sel) ? \" on\" : \"\"); c.textContent = l; c.onclick = function(){ onPick(v); }; el.appendChild(c); });\n}\nfunction pad(n){ return (\"0\" + n).slice(-2); }\nfunction dmy(ts){ var d = new Date(ts); return pad(d.getDate()) + \"/\" + pad(d.getMonth() + 1) + \"/\" + d.getFullYear(); }\nfunction hhmm(ts){ var d = new Date(ts); return pad(d.getHours()) + \":\" + pad(d.getMinutes()); }\nfunction durTxt(a, b){ var m = Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000)), h = Math.floor(m / 60); return h ? h + \"h\" + pad(m % 60) : m + \" min\"; }\n\n/* ---------- IndexedDB ---------- */\nvar IDB = null, REQ = [], memPh = {};\nfunction idbOpen(cb){\n  try { var rq = indexedDB.open(\"maint_requests\", 1);\n    rq.onupgradeneeded = function(){ var db = rq.result; if (!db.objectStoreNames.contains(\"req\")) db.createObjectStore(\"req\", {keyPath:\"id\"}); if (!db.objectStoreNames.contains(\"photos\")) db.createObjectStore(\"photos\", {keyPath:\"id\"}); };\n    rq.onsuccess = function(){ IDB = rq.result; cb(); }; rq.onerror = function(){ cb(); };\n  } catch(e){ cb(); }\n}\nfunction tx(s, m){ return IDB.transaction(s, m).objectStore(s); }\nfunction loadAll(cb){ if (!IDB){ cb(); return; } var out = [], c = tx(\"req\", \"readonly\").openCursor();\n  c.onsuccess = function(){ var cur = c.result; if (cur){ out.push(cur.value); cur.continue(); } else { REQ = out; cb(); } }; c.onerror = function(){ cb(); }; }\nfunction putReq(r, cb){ REQ if (!v) return fb; var d = new Date(v); return isNaN(d) ? fb : d.toISOString(); }\nasync function editReq(r){\n  EDIT = r; NEWPH = {};\n  for (var i = 0; i < r.photos.length; i++){ var d = await getPhoto(r.photos[i].id); if (d) NEWPH[r.photos[i].id] = d; }\n  E = {proc:r.proc, line:r.line, type:r.type || \"\", desc:r.desc || \"\", pri:r.pri, team:r.team || \"\", photos:r.photos.filter(function(p){ return NEWPH[p.id]; }).map(function(p){ return {id:p.id, thumb:p.thumb}; })};\n  $(\"eTs\").value = toLocal(r.ts); $(\"eFixTs\").value = toLocal(r.fixedAt); $(\"eFix\").value = r.fix || \"\";\n  location.hash = \"#new\"; drawNew();\n}\nfunction endEdit(){ var id = EDIT ? EDIT.id : null; EDIT = null; E = null; NEWPH = {}; return id; }\nfunction blank(){ return {proc:CFG.lastProc || procs()[0].name, line:null, type:\"\", desc:\"\", pri:\"normal\", photos:[]}; }\nfunction drawNew(){\n  if (!E) E = blank();\n  $(\"edBanner\").style.display = EDIT ? \"block\" : \"none\"; $(\"edMore\").style.display = EDIT ? \"block\" : \"none\"; $(\"eCancel\").style.display = EDIT ? \"block\" : \"none\";\n  if (EDIT){ $(\"edFixBox\").style.display = EDIT.status === \"ok\" ? \"block\" : \"none\";\n    chips($(\"eTeam\"), [[\"\",\"—\"]].concat([\"A\",\"B\",\"C\"].map(function(t){ return [t, \"班次 \" + t]; })), E.team || \"\", function(v){ E.team = v; drawNew(); }); }\n  var ps = procs(); if (!ps.some(function(p){ return p.name === E.proc; })) E.proc = ps[0].name;\n  var h = E.photos.map(function(p, i){ return '<div class=\"shot\"><img src=\"' + p.thumb + '\" data-e=\"' + i + '\"><b data-i=\"' + i + '\">✕<\/b><em class=\"edb\" data-e=\"' + i + '\">✏️ 标注<\/em><\/div>'; }).join(\"\");\n  if (E.photos.length < MAXPH) h += '<div class=\"shot addph\" id=\"aCam\"><i>📷<\/i>相机<\/div><div class=\"shot addph\" id=\"aGal\"><i>🖼<\/i>相册<\/div>';\n  $(\"shots\").innerHTML = h;\n  $(\"shots\").querySelectorAll(\".shot b\").forEach(function(b){ b.onclick = function(){ var p = E.photos.splice(+b.getAttribute(\"data-i\"), 1)[0]; delete NEWPH[p.id]; drawNew(); }; });\n  $(\"shots\").querySelectorAll(\"[data-e]\").forEach(function(el){ el.onclick = function(){ var p = E.photos[+el.getAttribute(\"data-e\")];\n    openEditor(NEWPH[p.id], function(full, thumb){ NEWPH[p.id] = full; p.thumb = thumb; drawNew(); }); }; });\n  if ($(\"aCam\")) $(\"aCam\").onclick = function(){ AFTER = null; $(\"fCam\").click(); };\n  if ($(\"aGal\")) $(\"aGal\").onclick = function(){ AFTER = null; $(\"fGal\").click(); };\n  chips($(\"eProc\"), ps.map(function(p){ return p.name; }), E.proc, function(v){ E.proc = v; E.line = null; drawNew(); });\n  var n = ps.filter(function(p){ return p.name === E.proc; })[0].n, ls = []; for (var i = 1; i <= n; i++) ls.push([i, \"L\" + i]);\n  chips($(\"eLine\"), ls, E.line, function(v){ E.line = v; drawNew(); }, \"sq\");\n  chips($(\"ePri\"), [[\"normal\",\"普通\"],[\"urgent\",\"紧急：线已停\"]], E.pri, function(v){ E.pri = v; drawNew(); }, \"urg\");\n  $(\"eDesc\").value = E.desc;\n}\n$(\"eDesc\").oninput = function(){ E.desc = this.value; };\nfunction addFiles(files){\n  var fs = Array.prototype.slice.call(files || []), room = MAXPH - E.photos.length;\n  if (fs.length > room){ toast(\"已取前 \" + room + \" 仅图片\"); fs = fs.slice(0, room); }\n  if (!fs.length) return; busy(1);\n  (function next(){ var f = fs.shift(); if (!f){ busy(0); drawNew(); return; }\n    compress(f, function(full, thumb){ if (full){ var id = uid(); NEWPH[id] = full; E.photos.push({id:id, thumb:thumb}); } next(); }); })();\n}\nvar AFTER = null;   // the request receiving \"after\" photos, when picking from its detail page\nfunction pick(r, cam){ AFTER = r; $(cam ? \"fCam\" : \"fGal\").click(); }\nfunction filesIn(files){ if (AFTER){ addAfter(AFTER, files); AFTER = null; } else addFiles(files); }\n$(\"fCam\").onchange = function(){ filesIn(this.files); this.value = \"\"; };\n$(\"fGal\").onchange = function(){ filesIn(this.files); this.value = \"\"; };\nfunction addAfter(r, files){\n  r.after = r.after || [];\n  var fs = Array.prototype.slice.call(files || []), room = MAXPH - r.after.length;\n  if (fs.length > room){ toast(\"已取前 \" + room + \" 仅图片\"); fs = fs.slice(0, room); }\n  if (!fs.length) return; busy(1);\n  (function next(){ var f = fs.shift(); if (!f){ busy(0); putReq(r, function(){ drawDet(r.id); }); return; }\n    compress(f, function(full, thumb){ if (!full){ next(); return; } var id = uid(); putPhoto(id, full, function(){ r.after.push({id:id, thumb:thumb}); next(); }); }); })();\n}\nfunction saveNew(send){\n  if (!E.line){ toast(\"选择线\"); return; }\n  if (!E.photos.length && !E.desc.trim()){ toast(\"请添加照片或输入描述\"); return; }\n  if (EDIT){ saveEdit(send); return; }\n  var r = {id:uid(), ts:new Date().toISOString(), proc:E.proc, line:E.line, type:E.type, desc:E.desc.trim(), pri:E.pri, team:teamToday(), by:CFG.name, status:\"open\", photos:E.photos, fixedAt:null, fix:\"\"};\n  var ids = E.photos.map(function(p){ return p.id; });\n  (function next(){ var id = ids.shift(); if (id){ putPhoto(id, NEWPH[id], next); return; }\n    putReq(r, function(){ CFG.lastProc = E.proc; saveCfg(); E = null; NEWPH = {}; toast(\"已保存\");\n      if (send){ shareReqs([r]); } location.hash = \"#list\"; }); })();\n}\nfunction saveEdit(send){\n  var r = EDIT, keep = {}; E.photos.forEach(function(p){ keep[p.id] = 1; });\n  r.photos.forEach(function(p){ if (!keep[p.id] && IDB) tx(\"photos\", \"readwrite\").delete(p.id); });   // photos removed while editing\n  r.proc = E.proc; r.line = E.line; r.desc = E.desc.trim(); r.pri = E.pri; r.team = E.team || \"\"; r.photos = E.photos;\n  r.ts = fromLocal($(\"eTs\").value, r.ts);\n  if (r.status === \"ok\"){ r.fixedAt = fromLocal($(\"eFixTs\").value, r.fixedAt); if (new Date(r.fixedAt) < new Date(r.ts)) r.fixedAt = r.ts; r.fix = $(\"eFix\").value.trim(); }\n  var ids = E.photos.map(function(p){ return p.id; });\n  (function next(){ var id = ids.shift(); if (id){ putPhoto(id, NEWPH[id], next); return; }\n    putReq(r, function(){ var rid = endEdit(); ed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:6}\nnav a{text-align:center;padding:9px 0 11px;color:var(--muted);text-decoration:none;font-size:12px;position:relative}\nnav a b{display:block;font-size:19px;line-height:1.2}\nnav a.on{color:var(--accent);font-weight:700}\nnav a i{position:absolute;top:4px;left:calc(50% - 22px);background:var(--stop);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 6px;font-weight:700}\n.view{display:none}.view.on{display:block}\n.row{display:flex;gap:8px;flex-wrap:wrap}\n.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 14px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}\n.toast.on{opacity:1}\n.empty{color:var(--muted);text-align:center;padding:16px 0}\n.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}\n.sheet.open{display:flex}\n.panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:14px 14px 20px;max-height:92vh;overflow:auto}\n.panel h3{margin:0 0 6px;font-size:16px}\n<\/style>\n<style>.homeBtn{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:10px;background:rgba(127,127,127,.16);color:inherit;text-decoration:none;margin-inline-end:8px;font-size:19px;vertical-align:middle;line-height:1}<\/style><\/head>\n<body>\n<header><h1><a href=\"#\" class=\"homeBtn\" onclick=\"parent.closeTool();return false\" aria-label=\"主页\">⌂<\/a>停线记录<\/h1><span class=\"muted\" id=\"hdr\"><\/span><\/header>\n<main>\n\n<section class=\"view\" id=\"v-now\">\n  <div id=\"liveList\"><\/div>\n  <button class=\"stop big\" id=\"newStop\">■ 立即登记停线<\/button>\n  <div class=\"card\" style=\"margin-top:12px\">\n    <h2>今天<\/h2>\n    <div class=\"kp\" id=\"todayKp\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"view\" id=\"v-log\">\n  <div class=\"card\">\n    <div class=\"chips\" id=\"lPeriod\" style=\"margin-bottom:6px\"><\/div>\n    <div class=\"chips\" id=\"lProc\" style=\"margin-bottom:6px\"><\/div>\n    <div id=\"log\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"view\" id=\"v-rep\">\n  <div class=\"card\">\n    <div class=\"chips\" id=\"rPeriod\" style=\"margin-bottom:6px\"><\/div>\n    <div class=\"chips\" id=\"rProc\" style=\"margin-bottom:8px\"><\/div>\n    <div class=\"kp\" id=\"rKp\"><\/div>\n  <\/div>\n  <div class=\"card\"><h2>按线号统计停机分钟<\/h2><div id=\"rLine\"><\/div><\/div>\n  <div class=\"card\"><h2>按故障类型统计停机分钟<\/h2><div id=\"rType\"><\/div><\/div>\n  <div class=\"card\"><h2>最长的停机<\/h2><div id=\"rLong\"><\/div><\/div>\n  <div class=\"card\">\n    <h2>报告给 Chiin<\/h2>\n    <pre id=\"rep\"><\/pre>\n    <div class=\"row\" style=\"margin-top:10px\"><button class=\"primary\" id=\"shareRep\">发送<\/button><button id=\"copyRep\">复制<\/button><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"view\" id=\"v-set\">\n  <div class=\"card\">\n    <h2>列表<\/h2>\n    <label class=\"lb\">工序和线数（每行一个工序：名称:数量)<\/label><textarea id=\"procTxt\" class=\"en\"><\/textarea>\n    <label class=\"lb\">故障类型（用逗号分隔)<\/label><textarea id=\"typeTxt\" class=\"en\" style=\"min-height:80px\"><\/textarea>\n    <label class=\"lb\">常用措施（用逗号分隔)<\/label><textarea id=\"actTxt\" class=\"en\" style=\"min-height:80px\"><\/textarea>\n    <label class=\"lb\">人员（用逗号分隔)<\/label><input id=\"whoTxt\" placeholder=\"Imad, Yasin, Mahdi\">\n    <button class=\"primary wide\" id=\"saveSet\">保存<\/button>\n  <\/div>\n  <div class=\"card\">\n    <h2>备份<\/h2>\n    <div class=\"row\"><button class=\"primary\" id=\"backup\">发送备份<\/button><button id=\"csv\">导出 CSV<\/button><\/div>\n    <label class=\"lb\">恢复：把备份粘贴到这里<\/label><textarea id=\"restoreTxt\"><\/textarea>\n    <button class=\"wide\" id=\"restore\">恢复<\/button>\n  <\/div>\n<\/section>\n<\/main>\n\n<div class=\"sheet\" id=\"sheet\"><div class=\"panel\" id=\"panel\"><\/div><\/div>\n<nav>\n  <a href=\"#now\" data-v=\"now\"><b>■<\/b>现在<i id=\"liveBadge\" style=\"display:none\"><\/i><\/a>\n  <a href=\"#log\" data-v=\"log\"><b>☰<\/b>记录<\/a>\n  <a href=\"#rep\" data-v=\"rep\"><b>▮<\/b>报告<\/a>\n  <a href=\"#set\" data-v=\"set\"><b>⚙<\/b>设置<\/a>\n<\/nav>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script id=\"core\">\nvar RESULTS = [[\"ok\",\"已修好\",\"Fixed\"],[\"tmp\",\"临时处理\",\"Temporary fix\"],[\"moved\",\"生产已转到其他线\",\"Production moved\"],[\"parts\",\"等待零件\",\"Waiting for parts\"],[\"no\",\"未解决\",\"Not solved\"]];\nvar MARK_ARRIVED = \"Maintenance arrived\";\nfunction mins(a, b){ return Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000)); }\n// downtime inside [from, to) only (a stop can cross midnight)\nfunction minsIn(s, from, to, now){\n  var a = new Date(s.start), b = s.end ? new Date(s.end) : now; if (a < from) a = from; if (b > to) b = to;\n  return b > a ? Math.round((b - a) / 60000) : 0;\n}\nfunction waitMins(s){\n  var arr = (s.acts || []).filter(function(x){ return x.text === MARK_ARRIVED; })[0];\n  return arr ? mins(s.start, arr.t) : null;\n}\nfunction stats(stops, from, to, now){\n  var tot = 0, n = 0, rep = 0, repN = 0, waits = [], byLine = {}, byType = {};\n  stops.forEach(function(s){\n    var m = minsIn(s, from, to, now); if (!m && !(new Date(s.start) >= from && new Date(s.start) < to)) return;\n    n++; tot += m;\n    if (s.end){ rep += mins(s.start, s.end); repN++; }\n    var w = waitMins(s); if (w != null) waits.push(w);\n    var k = s.proc + \" L\" + s.line; byLine[k] = (byLine[k] || 0) + m;\n    var t = s.type || \"—\"; byType[t] = (byType[t] || 0) + m;\n  });\n  return {tot:tot, n:n, mttr:repN ? Math.round(rep / repN) : 0, wait:waits.length ? Math.round(waits.reduce(function(a, b){ return a + b; }, 0) / waits.length) : null, byLine:byLine, byType:byType};\n}\nfunction hm(m){ m = Math.round(m); var h = Math.floor(m / 60), r = m % 60; return h ? h + \"h\" + (r < 10 ? \"0\" : \"\") + r : r + \"min\"; }\n<\/script>\n\n<script>\n/* team A/B/C shared by all tools: remembered for the current day */\nfunction teamToday(){ try { var o = JSON.parse(localStorage.getItem(\"team_today_v1\") || \"{}\"), d = new Date(), k = d.getFullYear() + \"-\" + (d.getMonth() + 1) + \"-\" + d.getDate(); return o.day === k ? o.team : \"\"; } catch(e){ return \"\"; } }\nfunction setTeamToday(t){ try { var d = new Date(); localStorage.setItem(\"team_today_v1\", JSON.stringify({day:d.getFullYear() + \"-\" + (d.getMonth() + 1) + \"-\" + d.getDate(), team:t})); } catch(e){} }\nvar TEAMS = [\"A\",\"B\",\"C\"];\nvar KEY = \"line_stops_v1\", mem = null;\nfunction load(){ try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return mem; }\nvar DB = load() || {\n  procTxt:\"Coloring:10\\nMMT:10\",\n  types:\"Fibre break, Tube break, Vibration, Bearing, Dancer / tension, Pay-off / take-up, Coiling / travers, Motor / drive, Electrical, Sensor, Printer, LED / UV, Nitrogen, Cooling water, Extruder / temperature, Material shortage, Quality hold, Other\",\n  acts:\"Maintenance called, Maintenance arrived, TL informed, Chiin informed, Bearing replaced, Pulley cleaned, Pulley replaced, Tension adjusted, Coiling parameters adjusted, Sensor adjusted, Speed reduced, Die cleaned, Rewinding (RWD), Line restarted, Production moved to another line, Waiting for parts\",\n  who:\"\",\n  stops:[]\n};\nfunction save(){ mem = DB; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ toast(\"保存失败\"); }  syncAtl(); }\nvar AUTO5M = {\"Bearing\":\"Machine\",\"Dancer\":\"Machine\",\"Vibration\":\"Machine\",\"Pulley\":\"Machine\",\"Sensor / length signal\":\"Machine\",\"LED / quartz\":\"Machine\",\"Die / mold\":\"Machine\",\n  \"Supplier material\":\"Material\",\"Ink\":\"Material\",\"Wrong length input\":\"Manpower\",\"Operator error\":\"Manpower\",\"Coiling / travers\":\"Method\",\"Nitrogen\":\"Environment\",\"Temperature\":\"Environment\"};\n\n/* every stop is copied to the fault log (atl_log_v1). Only stops that changed are rewritten, so edits made in the fault log stay. */\nfunction atlCauses(){ try { var A = JSON.parse(localStorage.getItem(\"atl_log_v1\") || \"{}\"); if (A.causes && A.causes.length) return A.causes; } catch(e){} return [\"Bearing\",\"Dancer\",\"Vibration\",\"Pulley\",\"Sensor / length signal\",\"Wrong length input\",\"Supplier material\",\"Coiling / travers\",\"Die / mold\",\"Ink\",\"LED / quartz\",\"Nitrogen\",\"Temperature\",\"Operator error\",\"Unknown\"]; }\nfunction syncAtl(){\n  try {\n    var A = JSON.parse(localStorage.getItem(\"atl_log_v1\") || \"{}\"); A.entries = A.entries || [];\n    var M = JSON.parse(localStorage.getItem(\"stops_atl_sync_v1\") || \"{}\"), now = new Date(), changed = false, seen = {};\n    DB.stops.forEach(function(s){\n      var sig = JSON.stringify(s) + (s.end ? \"\" : \"|live\"); seen[s.id] = 1;\n      if (M[s.id] === sig && s.end) return;\n      var h = new Date(s.start).getHours(), cause = s.cause || \"\";\n      var e = {id:\"s_\" + s.id, src:\"stop\", ts:s.start, proc:s.proc, line:s.line, team:s.team || \"\", shift:h < 8 ? \"N\" : h < 16 ? \"M\" : \"E\",\n        defect:s.type || \"Other\", cause:cause, m5:AUTO5M[cause] || \"\", km:\"\",\n        down:String(s.end ? mins(s.start, s.end) : mins(s.start, now)), detail:s.desc || \"\",\n        action:(s.acts || []).map(function(a){ return a.text + (a.who ? \" (\" + a.who + \")\" : \"\"); }).join(\" / \"),\n        status:s.end && s.result === \"ok\" ? \"closed\" : \"open\"};\n      var i = A.entries.map(function(x){ return x.id; }).indexOf(e.id);\n      if (i >= 0){ var o = A.entries[i]; if (o.km) e.km = o.km; if (o.m5 && !e.m5) e.m5 = o.m5; if (o.cause && !e.cause) e.cause = o.cause; A.entries[i] = e; }\n      else A.entries.push(e);\n      M[s.id] = sig; changed = true;\n    });\n    Object.keys(M).forEach(function(id){ if (!seen[id]){ A.entries = A.entries.filter(function(x){ return x.id !== \"s_\" + id; }); delete M[id]; changed = true; } });\n    if (changed){ localStorage.setItem(\"atl_log_v1\", JSON.stringify(A)); localStorage.setItem(\"stops_atl_sync_v1\", JSON.stringify(M)); }\n  } catch(e){}\n}\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nfunction uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\nfunction list(s){ return String(s || \"\").split(/[,，]/).map(function(x){ return x.trim(); }).filter(Boolean); }\nvar tt; function toast(m){ var t = $(\"toast\"); t.textContent = m; t.classList.add(\"on\"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove(\"on\"); }, 1900); }\nfunction procs(){ return DB.procTxt.split(\"\\n\").map(function(l){ var m = l.split(\":\"); return {name:(m[0] || \"\").trim(), n:parseInt(m[1], 10) || 0}; }).filter(function(p){ return p.name && p.n > 0; }); }\nfunction nLines(p){ var x = procs().filter(function(q){ return q.name === p; })[0]; return x ? x.n : 10; }\nfunction chips(el, items, sel, onPick, cls){\n  el.innerHTML = \"\";\n  items.forEach(function(it){\n    var v = Array.isArray(it) ? it[0] : it, l = Array.isArray(it) ? it[1] : it;\n    var c = document.createElement(\"span\"); c.className = \"chip\" + (cls ? \" \" + cls : \"\") + (String(v) === String(sel) ? \" on\" : \"\");\n    c.textContent = l; c.onclick = function(){ onPick(v); }; el.appendChild(c);\n  });\n}\nfunction share(text){ try { if (window.Android && Android.share){ Android.share(text); return; } } catch(e){} copy(text); }\nfunction copy(text){ var ta = document.createElement(\"textarea\"); ta.value = text; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand(\"copy\"); } catch(e){} document.body.removeChild(ta); toast(ok ? \"已复制\" : \"请手动复制文字\"); }\nfunction hhmm(iso){ var d = new  id=\"camBtn\">📷 相机<\/button><button id=\"galBtn\">🖼 从相册<\/button><span class=\"muted\" id=\"phCount\"><\/span><\/div>\n    <div class=\"ph\" id=\"phGrid\"><\/div>\n    <label class=\"lb\">描述（看到了什么？)<\/label><textarea id=\"eDesc\" class=\"en\" placeholder=\"What did you see?\"><\/textarea>\n    <label class=\"lb\">原因<\/label><div class=\"chips\" id=\"eCause\"><\/div><input id=\"eCauseTxt\" class=\"en\" style=\"margin-top:6px\" placeholder=\"Or write the cause\">\n    <label class=\"lb\">措施<\/label><textarea id=\"eAct\" class=\"en\" placeholder=\"What was done?\"><\/textarea>\n    <div class=\"two\">\n      <div><label class=\"lb\">状态<\/label><div class=\"chips\" id=\"eStat\"><\/div><\/div>\n      <div><label class=\"lb\">日期和时间<\/label><input type=\"datetime-local\" id=\"eTs\"><\/div>\n    <\/div>\n    <button class=\"primary wide\" id=\"eSave\">保存<\/button>\n    <button class=\"wide\" id=\"eCancel\" style=\"display:none\">取消修改<\/button>\n  <\/div>\n<\/section>\n\n<section class=\"view\" id=\"v-stats\">\n  <div class=\"card\">\n    <div class=\"chips\" id=\"sPeriod\" style=\"margin-bottom:8px\"><\/div>\n    <div class=\"kp\" id=\"sKp\"><\/div>\n  <\/div>\n  <div class=\"card\"><h2>柏拉图 (Pareto)<\/h2>\n    <div class=\"chips\" id=\"pBy\" style=\"margin-bottom:8px\"><\/div>\n    <canvas id=\"pCan\" style=\"width:100%;display:block\"><\/canvas>\n    <div class=\"muted\" id=\"pNote\" style=\"margin-top:6px;unicode-bidi:plaintext\"><\/div>\n    <button id=\"pShare\" style=\"width:100%;margin-top:8px\">发送柏拉图图片<\/button>\n  <\/div>\n  <div class=\"card\"><h2>按问题<\/h2><div id=\"sType\"><\/div><\/div>\n  <div class=\"card\"><h2>按线号<\/h2><div id=\"sLine\"><\/div><\/div>\n  <div class=\"card\"><h2>按颜色<\/h2><div id=\"sColor\"><\/div><\/div>\n<\/section>\n\n<section class=\"view\" id=\"v-set\">\n  <div class=\"card\">\n    <h2>列表（用逗号分隔)<\/h2>\n    <label class=\"lb\">Coloring 线数<\/label><input id=\"nLines\" type=\"number\" min=\"1\" max=\"30\">\n    <label class=\"lb\">问题类型<\/label><textarea id=\"typesTxt\" class=\"en\" style=\"min-height:80px\"><\/textarea>\n    <label class=\"lb\">常用原因<\/label><textarea id=\"causesTxt\" class=\"en\" style=\"min-height:80px\"><\/textarea>\n    <label class=\"lb\">光纤类型<\/label><input id=\"fibTxt\" class=\"en\">\n    <button class=\"primary wide\" id=\"saveSet\">保存<\/button>\n  <\/div>\n  <div class=\"card\">\n    <h2>存储<\/h2>\n    <div class=\"muted\" id=\"storeInfo\"><\/div>\n    <p class=\"muted\">照片保存在 App 内部。相机照片也会保存到相册的文件夹 Pictures/ColoringIssues，删除 App 也不会丢失.<\/p>\n  <\/div>\n<\/section>\n<\/main>\n\n<div class=\"viewer\" id=\"viewer\"><div class=\"vb\"><button id=\"vClose\">✕<\/button><span id=\"vIdx\"><\/span><span><\/span><\/div><div class=\"im\"><img id=\"vImg\" alt=\"\"><\/div><div class=\"vb\"><button id=\"vPrev\">→ 上一个<\/button><button id=\"vNext\">下一个 ←<\/button><\/div><\/div>\n<div class=\"busy\" id=\"busy\">处理中...<\/div>\n<div class=\"selbar\" id=\"selBar\"><span id=\"selN\"><\/span><button class=\"primary\" id=\"selSend\">发送<\/button><button id=\"selAll\">全部<\/button><button id=\"selX\">取消<\/button><\/div>\n<nav>\n  <a href=\"#list\" data-v=\"list\"><b>☰<\/b>问题<\/a>\n  <a href=\"#edit\" data-v=\"edit\"><b>＋<\/b>新<\/a>\n  <a href=\"#stats\" data-v=\"stats\"><b>▮<\/b>统计<\/a>\n  <a href=\"#set\" data-v=\"set\"><b>⚙<\/b>设置<\/a>\n<\/nav>\n<input type=\"file\" id=\"fCam\" accept=\"image/*\" capture=\"environment\">\n<input type=\"file\" id=\"fGal\" accept=\"image/*\" multiple>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\nvar COLORS = [[\"Blue\",\"#1e5bd7\"],[\"Orange\",\"#f28a1a\"],[\"Green\",\"#2e9e5b\"],[\"Brown\",\"#7a4a2a\"],[\"Slate\",\"#7d8590\"],[\"White\",\"#ffffff\"],[\"Red\",\"#d93b3b\"],[\"Black\",\"#111111\"],[\"Yellow\",\"#f2d21a\"],[\"Violet\",\"#7b4ad8\"],[\"Rose\",\"#f29ab8\"],[\"Aqua\",\"#3cc6d6\"]];\nvar MAXPH = 6;\nvar KEY = \"col_issues_cfg_v1\", mem = null;\nfunction loadCfg(){ try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return mem; }\nvar CFG = loadCfg() || {lines:10,\n  types:\"Fibre break, Color delete, Color NOK, Coiling NOK, Tension NOK, Ring / Printing NOK, ATT NOK, Short length, Bumps / ink buildup, Rough surface, Other\",\n  causes:\"Bearing, Dancer, Vibration, Pulley, Wrong length input, Supplier fibre, Coiling / traverse, Die / mold, Ink, LED / UV power, Quartz tube, Nitrogen, Humidity, Printer, Operator method, Unknown\",\n  fib:\"245, 200, 200 Ring, 180\"};\nfunction saveCfg(){ mem = CFG; try { localStorage.setItem(KEY, JSON.stringify(CFG)); } catch(e){} }\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nfunction uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }\nfunction list(s){ return String(s || \"\").split(/[,，]/).map(function(x){ return x.trim(); }).filter(Boolean); }\nvar tt; function toast(m){ var t = $(\"toast\"); t.textContent = m; t.classList.add(\"on\"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove(\"on\"); }, 1900); }\nfunction busy(on){ $(\"busy\").classList.toggle(\"on\", !!on); }\nfunction chips(el, items, sel, onPick, cls){\n  el.innerHTML = \"\";\n  items.forEach(function(it){\n    var v = Array.isArray(it) ? it[0] : it, l = Array.isArray(it) ? it[1] : it;\n    var c = document.createElement(\"span\"); c.className = \"chip\" + (cls ? \" \" + cls : \"\") + (String(v) === String(sel) ? \" on\" : \"\");\n    if (typeof l === \"object\"){ c.innerHTML = l.html; } else c.textContent = l; c.onclick = function(){ onPick(v); }; el.appendChild(c);\n  });\n}\nfunction shiftOf(d){ var h = d.getHours(); return h < 8 ? \"Night\" : h < 16 ? \"Morning\" : \"Evening\"; }\nfunction localInput(iso){ var d = new Date(iso), z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); }\nfunction dmy(iso){ var d = new Date(iso); return (\"0\" + d.getDate()).slice(-2) + \"/\" + (\"0\" + (d.getMonth() + 1)).slice(-2) + \"/\" + d.getFullYear(); }\nfunction hhmm(iso){ var d = new Date(iso); return (\"0\" + d.getHours()).slice(-2) + \":\" + (\"0\" + d.getMinutes()).slice(-2); }\n\n/* ---------- IndexedDB (issues + photos) ---------- */\nvar IDB = null, ISSUES = [], memPhotos = {};\nfunction idbOpen(cb){\n  try {\n    var rq = indexedDB.open(\"coloring_issues\", 1);\n    rq.onupgradeneeded = function(){ var db = rq.result; if (!db.objectStoreNames.contains(\"issues\")) db.createObjectStore(\"issues\", {keyPath:\"id\"}); if (!db.objectStoreNames.contains(\"photos\")) db.createObjectStore(\"photos\", {keyPath:\"id\"}); };\n    rq.onsuccess = function(){ IDB = rq.result; cb(); };\n    rq.onerror = function(){ IDB = null; cb(); };\n  } catch(e){ IDB = null; cb(); }\n}\nfunction tx(store, mode){ return IDB.transaction(store, mode).objectStore(store); }\nfunction loadIssues(cb){\n  if (!IDB){ cb(); return; }\n  var out = [], c = tx(\"issues\", \"readonly\").openCursor();\n  c.onsuccess = function(){ var cur = c.result; if (cur){ out.push(cur.value); cur.continue(); } else { ISSUES = out; cb(); } };\n  c.onerror = function(){ cb(); };\n}\nfunction putIssue(it, cb){ if (!IDB){ ISSUES = ISSUES.filter(function(x){ return x.id !== it.id; }).concat([it]); if (cb) cb(); return; }\n  var r = tx(\"issues\", \"readwrite\").put(it); r.onsuccess = function(){ ISSUES = ISSUES.filter(function(x){ return x.id !== it.id; }).concat([it]); if (cb) cb(); }; r.onerror = function(){ toast(\"保存失败\"); }; }\nfunction delIssue(id, cb){ var it = ISSUES.filter(function(x){ return x.id === id; })[0]; if (!it) return;\n  if (IDB){ tx(\"issues\", \"readwrite\").delete(id); (it.photos || []).forEach(function(p){ tx(\"photos\", \"readwrite\").delete(p.id); }); }\n  ISSUES = ISSUES.filter(function(x){ return x.id !== id; }); if (cb) cb(); }\nfunction putPhoto(id, data, cb){ if (!IDB){ memPhotos[id] = data; cb(); return; } var r = tx(\"photos\", \"readwrite\").put({id:id, data:data}); r.onsuccess = function(){ cb(); }; r.onerror = function(){ toast(\"存储已满\"); cb(true); }; }\nfunction getPhoto(id, cb){ if (!IDB){ cb(memPhotos[id]); return; } var r = tx(\"photos\", \"readonly\").get(id); r.onsuccess = function(){ cb(r.result ? r.result.data : null); }; r.onerror = function(){ cb(null); }; }\nfunction delPhoto(id){ if (IDB) tx(\"photos\", \"readwrite\").delete(id); else delete memPhotos[id]; }\n\n/* ---------- image processing ---------- */\nfunction compress(file, cb){\n  var url = URL.createObjectURL(file), img = new Image();\n  img.onload = function(){\n    function draw(max, q){ var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement(\"canvas\"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext(\"2d\").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL(\"image/jpeg\", q); }\n    var full = draw(1600, 0.82), thumb = draw(180, 0.7); URL.revokeObjectURL(url); cb(full, thumb);\n  };\n  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };\n  img.src = url;\n}\n\n/* ---------- edit ---------- */\n/* team A/B/C shared by all tools: remembered for the current day */\nfunction teamToday(){ try { var o = JSON.parse(localStorage.getItem(\"team_today_v1\") || \"{}\"), d = new Date(), k = d.getFullYear() + \"-\" + (d.getMonth() + 1) + \"-\" + d.getDate(); return o.day === k ? o.team : \"\"; } catch(e){ return \"\"; } }\nfunction setTeamToday(t){ try { var d = new Date(); localStorage.setItem(\"team_today_v1\", JSON.stringify({day:d.getFullYear() + \"-\" + (d.getMonth() + 1) + \"-\" + d.getDate(), team:t})); } catch(e){} }\nvar TEAMS = [\"A\",\"B\",\"C\"];\nvar E = null, editId = null, newPhotos = {}, removed = [];\nfunction blank(){ var now = new Date(); return {id:uid(), ts:now.toISOString(), line:CFG.lastLine || null, type:\"\", color:\"\", fib:CFG.lastFib || \"\", reel:\"\", km:\"\", desc:\"\", cause:\"\", act:\"\", status:\"open\", team:teamToday(), photos:[]}; }\nfunction startEdit(id){\n  var src = id ? ISSUES.filter(function(x){ return x.id === id; })[0] : null;\n  E = src ? JSON.parse(JSON.stringify(src)) : blank(); editId = src ? src.id : null; newPhotos = {}; removed = [];\n  $(\"eTitle\").textContent = src ? \"修改问题\" : \"新问题\"; $(\"eCancel\").style.display = src ? \"block\" : \"none\";\n  $(\"eReel\").value = E.reel; $(\"eKm\").value = E.km; $(\"eDesc\").value = E.desc; $(\"eAct\").value = E.act; $(\"eTs\").value = localInput(E.ts);\n  $(\"eCauseTxt\").value = list(CFG.causes).indexOf(E.cause) >= 0 ? \"\" : E.cause;\n  drawEdit();\n}\nfunction sync(){ E.reel = $(\"eReel\").value.trim(); E.km = $(\"eKm\").value.trim(); E.desc = $(\"eDesc\").value.trim(); E.act = $(\"eAct\").value.trim(); E.ts = $(\"eTs\").value ? new Date($(\"eTs\").value).toISOString() : E.ts; var ct = $(\"eCauseTxt\").value.trim(); if (ct) E.cause = ct; }\nfunction drawEdit(){\n  var ls = []; for (var i = 1; i <= (CFG.lines || 10); i++) ls.push(i);\n  chips($(\"eLine\"), ls, E.line, function(v){ sync(); E.line = v; drawEdit(); }, \"sq\");\n  chips($(\"eTeam\"), TEAMS.map(function(t){ return [t, \"班次 \" + t]; }), E.team, function(v){ sync(); E.team = v; drawEdit(); }, \"sq\");\n  chips($(\"eType\"), list(CFG.types), E.type, function(v){ sync(); E.type = v; drawEdit(); });\n  chips($(\"eColor\"), COLORS.map(function(c){ return [c[0], {html:'<i class=\"dot\" style=\"background:' + c[1] + '\"><\/i>' + c[0]}]; }), E.color, function(v){ sync(); E.color = E.color === v ? \"\" : v; drawEdit(); });\n  chips($(\"eFib\"), list(CFG.fib), E.fib, function(v){ sync(); E.fib = E.fib === v ? \"\" : v; drawEdit(); });\n  chips($(\"eCause\"), list(CFG.causes), E.cause, function(v){ sync(); E.cause = E.cause === v ? \"\" : v; $(\"eCauseTxt\").value = \"\"; drawEdit(); });\n  chips($(\"eStat\"), [[\"open\",\"未处理\"],[\"ok\",\"已解决\"]], E.status, function(v){ sync(); E.status = v; drawEdit( n.toast.on{opacity:1}\npre{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px;font-size:12.5px;direction:ltr;text-align:left;margin:0}\n.row{display:flex;gap:8px;flex-wrap:wrap}\n<\/style>\n<style>.homeBtn{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:10px;background:rgba(127,127,127,.16);color:inherit;text-decoration:none;margin-inline-end:8px;font-size:19px;vertical-align:middle;line-height:1}<\/style><\/head>\n<body>\n<header><h1><a href=\"#\" class=\"homeBtn\" onclick=\"parent.closeTool();return false\" aria-label=\"主页\">⌂<\/a>故障记录<\/h1><span class=\"muted\" id=\"hdrCount\"><\/span><\/header>\n\n<main>\n<!-- ADD -->\n<section class=\"view\" id=\"v-add\">\n  <div class=\"card\">\n    <h2 id=\"formTitle\">登记新故障<\/h2>\n    <label class=\"lb\">工序<\/label><div class=\"chips\" id=\"fProc\"><\/div>\n    <label class=\"lb\">线<\/label><div class=\"chips\" id=\"fLine\"><\/div>\n    <label class=\"lb\">班次<\/label><div class=\"chips\" id=\"fShift\"><\/div>\n    <label class=\"lb\">缺陷<\/label><div class=\"chips\" id=\"fDefect\"><\/div>\n    <label class=\"lb\">原因<\/label><div class=\"chips\" id=\"fCause\"><\/div>\n    <label class=\"lb\">分类 5M<\/label><div class=\"chips\" id=\"f5m\"><\/div>\n    <div class=\"two\">\n      <div><label class=\"lb\">位置（公里)<\/label><input type=\"number\" id=\"fKm\" step=\"0.01\" inputmode=\"decimal\" placeholder=\"例如 2.4\"><\/div>\n      <div><label class=\"lb\">停机时间（分钟)<\/label><input type=\"number\" id=\"fDown\" inputmode=\"numeric\" placeholder=\"0\"><\/div>\n    <\/div>\n    <label class=\"lb\">详情<\/label><textarea id=\"fDetail\" placeholder=\"你看到了什么？\"><\/textarea>\n    <label class=\"lb\">措施<\/label><textarea id=\"fAction\" placeholder=\"做了什么？谁处理的？\"><\/textarea>\n    <div class=\"two\">\n      <div><label class=\"lb\">日期和时间<\/label><input type=\"datetime-local\" id=\"fTs\"><\/div>\n      <div><label class=\"lb\">状态<\/label><div class=\"chips\" id=\"fStatus\"><\/div><\/div>\n    <\/div>\n    <button class=\"primary wide\" id=\"saveBtn\">保存<\/button>\n    <button class=\"wide\" id=\"cancelEdit\" style=\"display:none\">取消修改<\/button>\n  <\/div>\n<\/section>\n\n<!-- LIST -->\n<section class=\"view\" id=\"v-list\">\n  <div class=\"card\">\n    <div class=\"seg\" id=\"lPeriod\"><\/div>\n    <div class=\"seg\" id=\"lProc\"><\/div>\n    <div id=\"list\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- STATS -->\n<section class=\"view\" id=\"v-stats\">\n  <div class=\"card\">\n    <div class=\"seg\" id=\"sPeriod\"><\/div>\n    <div class=\"seg\" id=\"sProc\"><\/div>\n    <div class=\"seg\" id=\"sDefect\"><\/div>\n    <div class=\"kpis\" id=\"kpis\"><\/div>\n  <\/div>\n  <div class=\"card\"><h2>Pareto<\/h2>\n<div class=\"seg\" id=\"pBy\"><\/div>\n<div class=\"seg\" id=\"pMeas\"><\/div>\n<canvas id=\"pCan\" style=\"width:100%;display:block\"><\/canvas>\n<div class=\"muted\" id=\"pNote\" style=\"margin-top:6px\"><\/div>\n<div class=\"row\" style=\"margin-top:10px\"><button class=\"primary\" id=\"pShare\">发送柏拉图图片<\/button><button id=\"pCsv\">发送数据 CSV<\/button><\/div>\n<\/div>\n<div class=\"card\"><h2>天数<\/h2><div id=\"trend\"><\/div><\/div>\n  <div class=\"card\"><h2>Pareto 原因<\/h2><div id=\"parCause\"><\/div><\/div>\n  <div class=\"card\"><h2>Pareto 缺陷<\/h2><div id=\"parDefect\"><\/div><\/div>\n  <div class=\"card\"><h2>按线号<\/h2><div id=\"parLine\"><\/div><\/div>\n  <div class=\"card\">\n    <h2>报告给 Chiin (英文)<\/h2>\n    <pre id=\"report\"><\/pre>\n    <div class=\"row\" style=\"margin-top:10px\"><button class=\"primary\" id=\"shareRep\">发送<\/button><button id=\"copyRep\">复制<\/button><\/div>\n  <\/div>\n<\/section>\n\n<!-- SETTINGS -->\n<section class=\"view\" id=\"v-set\">\n  <div class=\"card\">\n    <h2>每个工序的缺陷列表<\/h2>\n    <p class=\"muted\">用逗号分隔缺陷。可以添加或删除.<\/p>\n    <div id=\"defLists\"><\/div>\n    <label class=\"lb\">原因列表（适用于所有工序)<\/label><textarea id=\"causeList\"><\/textarea>\n    <label class=\"lb\">每个工序的线数<\/label><div id=\"lineCounts\"><\/div>\n    <button class=\"primary wide\" id=\"saveLists\">保存列表<\/button>\n  <\/div>\n  <div class=\"card\">\n    <h2>备份<\/h2>\n    <p class=\"muted\">如果删除 App，数据会丢失。请给自己发一份备份到 WhatsApp 每周.<\/p>\n    <div class=\"row\"><button class=\"primary\" id=\"backup\">发送备份<\/button><button id=\"csv\">导出 CSV<\/button><\/div>\n    <label class=\"lb\">恢复：把备份粘贴到这里<\/label><textarea id=\"restoreTxt\"><\/textarea>\n    <button class=\"wide\" id=\"restore\">恢复<\/button>\n  <\/div>\n<\/section>\n<\/main>\n\n<nav>\n  <a href=\"#add\" data-v=\"add\"><b>＋<\/b>登记<\/a>\n  <a href=\"#list\" data-v=\"list\"><b>☰<\/b>记录<\/a>\n  <a href=\"#stats\" data-v=\"stats\"><b>▮<\/b>Pareto<\/a>\n  <a href=\"#set\" data-v=\"set\"><b>⚙<\/b>设置<\/a>\n<\/nav>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script id=\"core\">\nvar PROCS = [\"Coloring\",\"MMT\",\"SC\",\"CP\",\"JKT\"];\nvar DEF_DEFECTS = {\n  Coloring:[\"Fibre break\",\"Color delete\",\"Color NOK\",\"Coiling NOK\",\"Tension NOK\",\"Ring / Printing NOK\",\"Short length\",\"Other\"],\n  MMT:[\"Tube break\",\"OD variation\",\"Lumps\",\"Thickness NOK\",\"EFL NOK\",\"Coiling NOK\",\"Other\"],\n  SC:[\"Tube break\",\"OD variation\",\"Lumps\",\"Thickness NOK\",\"EFL NOK\",\"Other\"],\n  CP:[\"FRP break\",\"Tube break\",\"Dancer NOK\",\"Coiling NOK\",\"Other\"],\n  JKT:[\"Lumps\",\"Holes / porosity\",\"Folds\",\"OD NOK\",\"Thickness NOK\",\"Attenuation NOK\",\"Other\"]\n};\nvar DEF_CAUSES = [\"Bearing\",\"Dancer\",\"Vibration\",\"Pulley\",\"Sensor / length signal\",\"Wrong length input\",\"Supplier material\",\"Coiling / travers\",\"Die / mold\",\"Ink\",\"LED / quartz\",\"Nitrogen\",\"Temperature\",\"Operator error\",\"Unknown\"];\nvar DEF_LINES = {Coloring:10, MMT:10, SC:4, CP:4, JKT:12};\nvar M5 = [\"Machine\",\"Material\",\"Method\",\"Manpower\",\"Environment\"];\nvar AUTO5M = {\"Bearing\":\"Machine\",\"Dancer\":\"Machine\",\"Vibration\":\"Machine\",\"Pulley\":\"Machine\",\"Sensor / length signal\":\"Machine\",\"LED / quartz\":\"Machine\",\"Die / mold\":\"Machine\",\n  \"Supplier material\":\"Material\",\"Ink\":\"Material\",\"Wrong length input\":\"Manpower\",\"Operator error\":\"Manpower\",\"Coiling / travers\":\"Method\",\"Nitrogen\":\"Environment\",\"Temperature\":\"Environment\"};\nvar SHIFTS = [[\"N\",\"夜班 00-08\"],[\"M\",\"早班 08-16\"],[\"E\",\"中班 16-24\"]];\nfunction shiftOf(d){ var h = d.getHours(); return h < 8 ? \"N\" : h < 16 ? \"M\" : \"E\"; }\nfunction dayKey(d){ return d.getFullYear() + \"-\" + (\"0\" + (d.getMonth() + 1)).slice(-2) + \"-\" + (\"0\" + d.getDate()).slice(-2); }\nfunction startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }\nfunction addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }\nfunction weekStart(d){ var s = startOfDay(d); return addDays(s, -((s.getDay() + 6) % 7)); }\n// period -> [from, to) and previous comparable period\nfunction periodRange(p, now){\n  var t = startOfDay(now), a, b;\n  if (p === \"week\"){ a = weekStart(now); b = addDays(a, 7); return {a:a, b:b, pa:addDays(a, -7), pb:a}; }\n  if (p === \"lastweek\"){ b = weekStart(now); a = addDays(b, -7); return {a:a, b:b, pa:addDays(a, -7), pb:a}; }\n  if (p === \"month\"){ a = new Date(t.getFullYear(), t.getMonth(), 1); b = new Date(t.getFullYear(), t.getMonth() + 1, 1); return {a:a, b:b, pa:new Date(t.getFullYear(), t.getMonth() - 1, 1), pb:a}; }\n  if (p === \"lastmonth\"){ b = new Date(t.getFullYear(), t.getMonth(), 1); a = new Date(t.getFullYear(), t.getMonth() - 1, 1); return {a:a, b:b, pa:new Date(t.getFullYear(), t.getMonth() - 2, 1), pb:a}; }\n  if (p === \"30\"){ b = addDays(t, 1); a = addDays(b, -30); return {a:a, b:b, pa:addDays(a, -30), pb:a}; }\n  return {a:new Date(2000,0,1), b:addDays(t, 1), pa:null, pb:null};\n}\nfunction inRange(e, a, b){ var d = new Date(e.ts); return d >= a && d < b; }\nfunction pareto(entries, key){\n  var m = {}; entries.forEach(function(e){ var k = e[key] || \"—\"; m[k] = (m[k] || 0) + 1; });\n  var arr = Object.keys(m).map(function(k){ return {k:k, n:m[k]}; }).sort(function(x, y){ return y.n - x.n || (x.k < y.k ? -1 : 1); });\n  var tot = entries.length, cum = 0;\n  arr.forEach(function(x){ cum += x.n; x.pct = tot ? x.n / tot * 100 : 0; x.cum = tot ? cum / tot * 100 : 0; });\n  return arr;\n}\n// elapsed days counted for the average (do not count future days of the current period)\nfunction elapsedDays(a, b, now){ var end = b < addDays(startOfDay(now), 1) ? b : addDays(startOfDay(now), 1); return Math.max(1, Math.round((end - a) / 86400000)); }\n<\/script>\n\n<script>\n/* team A/B/C shared by all tools: remembered for the current day */\nfunction teamToday(){ try { var o = JSON.parse(localStorage.getItem(\"team_today_v1\") || \"{}\"), d = new Date(), k = d.getFullYear() + \"-\" + (d.getMonth() + 1) + \"-\" + d.getDate(); return o.day === k ? o.team : \"\"; } catch(e){ return \"\"; } }\nfunction setTeamToday(t){ try { var d = new Date(); localStorage.setItem(\"team_today_v1\", JSON.stringify({day:d.getFullYear() + \"-\" + (d.getMonth() + 1) + \"-\" + d.getDate(), team:t})); } catch(e){} }\nvar TEAMS = [\"A\",\"B\",\"C\"];\nvar KEY = \"atl_log_v1\", mem = null;\nfunction load(){ try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return mem || {}; }\nvar DB = load();\nDB.entries = DB.entries || []; DB.defects = DB.defects || JSON.parse(JSON.stringify(DEF_DEFECTS));\nDB.causes = DB.causes || DEF_CAUSES.slice(); DB.lines = DB.lines || JSON.parse(JSON.stringify(DEF_LINES));\nDB.last = DB.last || {proc:\"Coloring\", line:1};\nfunction save(){ mem = DB; try { localStorage.setItem(KEY, JSON.stringify(DB)); return true; } catch(e){ toast(\"保存失败：存储已满\"); return false; } }\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nvar tt;\nfunction toast(m){ var t = $(\"toast\"); t.textContent = m; t.classList.add(\"on\"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove(\"on\"); }, 1800); }\nfunction share(text){\n  try { if (window.Android && Android.share){ Android.share(text); return; } } catch(e){}\n  copy(text);\n}\nfunction copy(text){\n  var ta = document.createElement(\"textarea\"); ta.value = text; document.body.appendChild(ta); ta.select();\n  var ok = false; try { ok = document.execCommand(\"copy\"); } catch(e){}\n  document.body.removeChild(ta); toast(ok ? \"已复制\" : \"请手动复制文字\");\n}\nfunction chips(el, items, sel, onPick, cls){\n  el.innerHTML = \"\";\n  items.forEach(function(it){\n    var v = Array.isArray(it) ? it[0] : it, l = Array.isArray(it) ? it[1] : it;\n    var c = document.createElement(\"span\"); c.className = \"chip\" + (cls ? \" \" + cls : \"\") + (String(v) === String(sel) ? \" on\" : \"\");\n    c.textContent = l; c.onclick = function(){ onPick(v); }; el.appendChild(c);\n  });\n}\n\n/* ---------- form ---------- */\nvar F = null, editId = null;\nfunction localInput(d){ var z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); }\nfunction newForm(){\n  var now = new Date();\n  F = {proc:DB.last.proc, line:DB.last.line, shift:shiftOf(now), team:teamToday(), defect:null, cause:null, m5:null, status:\"open\"};\n  $(\"fTs\").value = localInput(now); $(\"fKm\").value = \"\"; $(\"fDown\").value = \"\"; $(\"fDetail\").value = \"\"; $(\"fAction\").value = \"\";\n  editId = null; $(\"formTitle\").textContent = \"登记新故障\"; $(\"cancelEdit\").style.display = \"none\";\n  drawForm();\n}\nfunction drawForm(){\n  chips($(\"fProc\"), PROCS, F.proc, function(v){ F.proc = v; F.defect = null; if (F.line > (DB.lines[v] || 10)) F.line = 1; drawForm(); });\n  var n = DB.lines[F.proc] || 10, ls = []; for (var i = 1; i <= n; i++) ls.push(i);\n  chips($(\"fLine\"), ls, F.line, function(v){ F.line = v; drawForm(); }, \"sq\");\n  chips($(\"fShift\"), TEAMS.map(function(t){ return [t, \"班次 \" + t]; }) ar(--warn);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 6px;font-weight:700}\n.view{display:none}.view.on{display:block}\n.row{display:flex;gap:8px;flex-wrap:wrap}\n.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 14px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}\n.toast.on{opacity:1}\n.empty{color:var(--muted);text-align:center;padding:16px 0}\n.cnt{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}\n.cnt:first-child{border-top:0}\n.cnt b{direction:ltr}\n<\/style>\n<style>.homeBtn{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:10px;background:rgba(127,127,127,.16);color:inherit;text-decoration:none;margin-inline-end:8px;font-size:19px;vertical-align:middle;line-height:1}<\/style><\/head>\n<body>\n<header><h1><a href=\"#\" class=\"homeBtn\" onclick=\"parent.closeTool();return false\" aria-label=\"主页\">⌂<\/a>零件更换<\/h1><span class=\"muted\" id=\"hdr\"><\/span><\/header>\n<main>\n\n<section class=\"view\" id=\"v-add\">\n  <div class=\"card\">\n    <h2 id=\"fTitle\">登记零件更换<\/h2>\n    <label class=\"lb\">零件<\/label><div class=\"chips\" id=\"fPart\"><\/div>\n    <input id=\"fPartTxt\" class=\"en\" placeholder=\"Or type the part (e.g. Bearing 6202)\" style=\"margin-top:6px\">\n    <label class=\"lb\">数量<\/label><input id=\"fQty\" type=\"text\" inputmode=\"decimal\" class=\"en\" placeholder=\"1\" style=\"max-width:140px;font-size:17px;font-weight:700\">\n\n    <div class=\"sub\" style=\"display:none\">\n      <b>安装在<\/b>\n      <label class=\"lb\">工序<\/label><div class=\"chips\" id=\"fProc\"><\/div>\n      <label class=\"lb\">线<\/label><div class=\"chips\" id=\"fLine\"><\/div>\n    <\/div>\n\n    <div class=\"sub\">\n      <b>来自哪里？<\/b>\n      <div class=\"chips\" id=\"fSrc\" style=\"margin-top:8px\"><\/div>\n =\"edOk\">✓ 保存<\/button><\/div>\n  <div class=\"edwrap\" id=\"edWrap\"><canvas id=\"edC\"><\/canvas><\/div>\n  <div class=\"edtxt\" id=\"edTxt\"><input id=\"edTxtIn\" class=\"en\" placeholder=\"Write here\"><button class=\"primary\" id=\"edTxtOk\">✓<\/button><\/div>\n  <div class=\"edbar\"><div class=\"tools\" id=\"edTools\"><\/div><div class=\"cols\" id=\"edCols\"><\/div><\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\nvar KEY = \"parts_replace_v1\", mem = null;\nvar SRC = [[\"line\",\"从其他线\"],[\"wh\",\"仓库\"],[\"maint\",\"维修库\"],[\"other\",\"其他来源\"]];\nvar SRC_EN = {line:\"from\", wh:\"from warehouse\", maint:\"from maintenance store\", other:\"from\"};\nfunction load(){ try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return mem; }\nvar DB = load() || {\n  procTxt:\"Coloring:10\\nMMT:10\",\n  parts:\"Bearing, Guide pulley / wheel, Capstan belt, UV LED lamp, Drying lamp, Lamp switch, Sensor, Dancer, Screen pack\",\n  who:\"\", why:\"Broken, Hot / overheating, Worn, Vibration, Noise, Not working\",\n  log:[]\n};\nfunction save(){ mem = DB; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ toast(\"保存失败\"); } }\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nfunction uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\nfunction list(s){ return String(s || \"\").split(/[,，]/).map(function(x){ return x.trim(); }).filter(Boolean); }\nvar tt; function toast(m){ var t = $(\"toast\"); t.textContent = m; t.classList.add(\"on\"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove(\"on\"); }, 1800); }\nfunction procs(){ return DB.procTxt.split(\"\\n\").map(function(l){ var m = l.split(\":\"); return {name:(m[0] || \"\").trim(), n:parseInt(m[1], 10) || 0}; }).filter(function(p){ return p.name && p.n > 0; }); }\nfunction nLines(p){ var x = procs().filter(function(q){ return q.name === p; })[0]; return x ? x.n : 10; }\nfunction chips(el, items, sel, onPick, cls){\n  el.innerHTML = \"\";\n  items.forEach(function(it){\n    var v = Array.isArray(it) ? it[0] : it, l = Array.isArray(it) ? it[1] : it;\n    var c = document.createElement(\"span\"); c.className = \"chip\" + (cls ? \" \" + cls : \"\") + (String(v) === String(sel) ? \" on\" : \"\");\n    c.textContent = l; c.onclick = function(){ onPick(v); }; el.appendChild(c);\n  });\n}\nfunction share(text){ try { if (window.Android && Android.share){ Android.share(text); return; } } catch(e){} copy(text); }\nfunction copy(text){ var ta = document.createElement(\"textarea\"); ta.value = text; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand(\"copy\"); } catch(e){} document.body.removeChild(ta); toast(ok ? \"已复制\" : \"请手动复制文字\"); }\nfunction todayStr(){ var d = new Date(), z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }\nfunction dmy(s){ return s ? s.split(\"-\").reverse().join(\"/\") : \"\"; }\nfunction dm(s){ var p = (s || \"\").split(\"-\"); return p[2] + \"/\" + p[1]; }\nfunction range(p){\n  var n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate()), a;\n  if (p === \"today\") a = t;\n  else if (p === \"week\") a = new Date(t.getFullYear(), t.getMonth(), t.getDate() - ((t.getDay() + 6) % 7));\n  else if (p === \"month\") a = new Date(t.getFullYear(), t.getMonth(), 1);\n  else if (p === \"30\") a = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 29);\n  else a = new Date(2000, 0, 1);\n  var z = new Date(a.getTime() - a.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10);\n}\nvar PERIODS = [[\"today\",\"今天\"],[\"week\",\"本周\"],[\"month\",\"本月\"],[\"30\",\"最近 30 天\"],[\"all\",\"全部\"]];\nfunction inst(e){ return e.line ? e.proc + \" L\" + e.line : \"\"; }\nfunction srcText(e){\n  if (e.src === \"line\") return (e.sProc || \"\") + \" L\" + e.sLine;\n  if (e.src === \"wh\") return \"仓库\";\n  if (e.src === \"maint\") return \"维修库\";\n  return e.srcTxt || \"其他来源\";\n}\nfunction srcEn(e){\n  if (e.src === \"line\") return \"taken from \" + (e.sProc || \"\") + \" L\" + e.sLine;\n  if (e.src === \"wh\") return \"from warehouse\";\n  if (e.src === \"maint\") return \"from maintenance store\";\n  return \"from \" + (e.srcTxt || \"other\");\n}\n\n/* ---------- photos (kept in IndexedDB, never in the gallery) ---------- */\nvar IDB = null, memPh = {}, MAXPH = 3;\nfunction busy(on){ $(\"busy\").classList.toggle(\"on\", !!on); }\nfunction idbOpen(cb){ try { var rq = indexedDB.open(\"parts_photos\", 1);\n  rq.onupgradeneeded = function(){ if (!rq.result.objectStoreNames.contains(\"photos\")) rq.result.createObjectStore(\"photos\", {keyPath:\"id\"}); };\n  rq.onsuccess = function(){ IDB = rq.result; cb(); }; rq.onerror = function(){ cb(); }; } catch(e){ cb(); } }\nfunction putPhoto(o, cb){ if (!IDB){ memPh[o.id] = o; cb(); return; } var q = IDB.transaction(\"photos\", \"readwrite\").objectStore(\"photos\").put(o); q.onsuccess = function(){ cb(); }; q.onerror = function(){ toast(\"存储已满\"); cb(); }; }\nfunction getPh(id){ return new Promise(function(res){ if (!IDB){ res(memPh[id] || null); return; } var q = IDB.transaction(\"photos\", \"readonly\").objectStore(\"photos\").get(id); q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; }); }\nfunction delPh(id){ if (IDB) IDB.transaction(\"photos\", \"readwrite\").objectStore(\"photos\").delete(id); else delete memPh[id]; }\nfunction compress(file, cb){\n  var url = URL.createObjectURL(file), img = new Image();\n  img.onload = function(){\n    function draw(max, q){ var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement(\"canvas\"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getCont return JSON.parse(r); } catch(e){} return mem; }\nvar DB = load();\nif (!DB){\n  DB = {procTxt:DEF.procTxt, minSpare:DEF.minSpare, quartz:[], rules:DEF.rules.map(function(r, i){ r.id = \"r\" + i; return r; }),\n        dies:DEF.dies.map(function(d, i){ return {id:\"d\" + i, proc:d.proc, kind:d.kind, size:d.size, inUse:0, spare:0, lines:[], note:\"\"}; })};\n}\nfunction save(){ mem = DB; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ toast(\"保存失败\"); } }\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s == null ? \"\" : s).replace(/[&<>\"]/g, function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nfunction uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\nvar tt; function toast(m){ var t = $(\"toast\"); t.textContent = m; t.classList.add(\"on\"); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove(\"on\"); }, 1800); }\nfunction procs(){ return DB.procTxt.split(\"\\n\").map(function(l){ var m = l.split(\":\"); return {name:(m[0] || \"\").trim(), n:parseInt(m[1], 10) || 0}; }).filter(function(p){ return p.name && p.n > 0; }); }\nfunction nLines(p){ var x = procs().filter(function(q){ return q.name === p; })[0]; return x ? x.n : 10; }\nfunction chips(el, items, sel, onPick, cls, multi){\n  el.innerHTML = \"\";\n  items.forEach(function(it){\n    var v = Array.isArray(it) ? it[0] : it, l = Array.isArray(it) ? it[1] : it;\n    var on = multi ? sel.indexOf(v) >= 0 : String(v) === String(sel);\n    var c = document.createElement(\"span\"); c.className = \"chip\" + (cls ? \" \" + cls : \"\") + (on ? \" on\" : \"\");\n    c.textContent = l; c.onclick = function(){ onPick(v); }; el.appendChild(c);\n  });\n}\nfunction share(text){ try { if (window.Android && Android.share){ Android.share(text); return; } } catch(e){} copy(text); }\nfunction copy(text){ var ta = document.createElement(\"textarea\"); ta.value = text; document.body.appendChi
